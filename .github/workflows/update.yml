name: Update scoreboard

on:
  schedule:
    # 06:30 UTC daily = 1:30am Central. Adjust if you like.
    - cron: "30 6 * * *"
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Build scoreboard
        env:
          LEAGUE_ID: "6206"
          TZ_NAME: "America/Chicago"
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No change this run."
          else
            git commit -m "Update scoreboard"
            git push
          fi
